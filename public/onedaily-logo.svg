<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="numberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Neural network pattern background -->
  <g opacity="0.8">
    <!-- Connection lines forming circular pattern -->
    <circle cx="100" cy="100" r="85" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.2"/>
    <circle cx="100" cy="100" r="65" stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.3"/>
    <circle cx="100" cy="100" r="45" stroke="#0ea5e9" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Outer nodes -->
    <circle cx="100" cy="15" r="6" fill="#3b82f6"/>
    <circle cx="154" cy="35" r="6" fill="#3b82f6"/>
    <circle cx="185" cy="100" r="6" fill="#3b82f6"/>
    <circle cx="154" cy="165" r="6" fill="#3b82f6"/>
    <circle cx="100" cy="185" r="6" fill="#3b82f6"/>
    <circle cx="46" cy="165" r="6" fill="#3b82f6"/>
    <circle cx="15" cy="100" r="6" fill="#3b82f6"/>
    <circle cx="46" cy="35" r="6" fill="#3b82f6"/>

    <!-- Middle nodes -->
    <circle cx="100" cy="35" r="5" fill="#06b6d4"/>
    <circle cx="135" cy="55" r="5" fill="#06b6d4"/>
    <circle cx="165" cy="100" r="5" fill="#06b6d4"/>
    <circle cx="135" cy="145" r="5" fill="#06b6d4"/>
    <circle cx="100" cy="165" r="5" fill="#06b6d4"/>
    <circle cx="65" cy="145" r="5" fill="#06b6d4"/>
    <circle cx="35" cy="100" r="5" fill="#06b6d4"/>
    <circle cx="65" cy="55" r="5" fill="#06b6d4"/>

    <!-- Inner nodes -->
    <circle cx="100" cy="55" r="4" fill="#0ea5e9"/>
    <circle cx="122" cy="72" r="4" fill="#0ea5e9"/>
    <circle cx="145" cy="100" r="4" fill="#0ea5e9"/>
    <circle cx="122" cy="128" r="4" fill="#0ea5e9"/>
    <circle cx="100" cy="145" r="4" fill="#0ea5e9"/>
    <circle cx="78" cy="128" r="4" fill="#0ea5e9"/>
    <circle cx="55" cy="100" r="4" fill="#0ea5e9"/>
    <circle cx="78" cy="72" r="4" fill="#0ea5e9"/>

    <!-- Connecting lines radiating from center -->
    <line x1="100" y1="15" x2="100" y2="55" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <line x1="154" y1="35" x2="122" y2="72" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <line x1="185" y1="100" x2="145" y2="100" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <line x1="154" y1="165" x2="122" y2="128" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <line x1="100" y1="185" x2="100" y2="145" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <line x1="46" y1="165" x2="78" y2="128" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <line x1="15" y1="100" x2="55" y2="100" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <line x1="46" y1="35" x2="78" y2="72" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Ultra modern geometric "1" -->
  <g filter="url(#shadow)">
    <!-- Main vertical bar - clean geometric shape -->
    <rect x="80" y="50" width="40" height="105" fill="url(#numberGradient)" rx="4"/>

    <!-- Modern angled top serif -->
    <path d="M 80 75 L 80 50 L 55 75 L 65 80 Z" fill="url(#numberGradient)"/>

    <!-- Clean base serif -->
    <rect x="60" y="150" width="80" height="10" fill="url(#numberGradient)" rx="2"/>

    <!-- Glossy overlay for modern look -->
    <rect x="85" y="55" width="12" height="95" fill="white" opacity="0.25" rx="2"/>

    <!-- Top highlight -->
    <ellipse cx="100" cy="65" rx="12" ry="6" fill="white" opacity="0.2"/>
  </g>

  <!-- Animated pulse on nodes -->
  <circle cx="100" cy="15" r="6" fill="#3b82f6">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="185" cy="100" r="6" fill="#3b82f6">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="185" r="6" fill="#3b82f6">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="15" cy="100" r="6" fill="#3b82f6">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
